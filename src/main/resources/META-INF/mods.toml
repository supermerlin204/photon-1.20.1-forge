modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"

[[mods]]
modId = "${mod_id}"
version = "${version}"
displayName = "${mod_name}"
authors = "KilaBash"
description = "${mod_description}"
logoFile = "icon.png"
displayURL = "${mod_url}"
issueTrackerURL = "https://github.com/Low-Drag-MC/Photon/issues"

[[dependencies.${mod_id}]]
    modId = "forge"
    mandatory = true
    versionRange = "${forge_version_range}"
    ordering = "NONE"
    side = "BOTH"
[[dependencies.${mod_id}]]
    modId = "minecraft"
    mandatory = true
    versionRange = "[${minecraft_version}]"
    ordering = "NONE"
    side = "BOTH"
[[dependencies.${mod_id}]]
    modId = "ldlib2"
    mandatory = true
    versionRange = "${ldlib2_version_range}"
    ordering = "AFTER"
    side = "BOTH"
[[dependencies.${mod_id}]]
    modId = "kilagraph"
    mandatory = true
    versionRange = "${kilagraph_version_range}"
    ordering = "AFTER"
    side = "BOTH"
[[dependencies.${mod_id}]]
    modId = "kotlinforforge"
    mandatory = true
    versionRange = "[${kotlin_for_forge_version},)"
    ordering = "AFTER"
    side = "BOTH"

[features.${mod_id}]
openGLVersion = "[3.2,)"
